# Optional GPU acceleration. Apply with:
# docker compose -f docker-compose.full-stack.yml -f docker-compose.nvidia.yml up -d
services:
  jellyfin:
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # Persist JIT-compiled CUDA kernels (scale_cuda/tonemap_cuda). Jellyfin runs as uid 1000 with
      # HOME=/root (unwritable), so the default ~/.nv cache never persisted: ~2.3s lost per GPU transcode start.
      CUDA_CACHE_PATH: /cache/cuda
      CUDA_CACHE_MAXSIZE: "1073741824"
